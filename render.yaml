# Render Blueprint for the Tinted API.
#
# Apply from the Render dashboard: New -> Blueprint -> point at this repo.
# The frontend is on Vercel and is not described here.
#
# Secrets are deliberately sync:false — Render prompts for them on first deploy
# rather than storing them in the repository.

services:
  - type: web
    name: tinted-api
    runtime: docker
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    plan: free
    region: oregon
    healthCheckPath: /health
    autoDeploy: true

    envVars:
      - key: ANTHROPIC_API_KEY
        sync: false

      # Comma-separated origins allowed to call this API. MUST be set to the
      # deployed frontend origin — left unset, main.py stays in dev mode and
      # accepts any localhost origin, which means the Vercel site is refused.
      - key: ALLOWED_ORIGINS
        sync: false

      # Optional regex for origins that can't be listed, e.g. Vercel previews.
      - key: ALLOWED_ORIGIN_REGEX
        sync: false

      # Hard ceiling on estimated Claude spend per UTC day. Paid endpoints
      # return 503 once crossed, resetting at midnight UTC. The per-IP rate
      # limit is forgeable via X-Forwarded-For, so this is the real backstop.
      - key: DAILY_BUDGET_USD
        value: "5.00"

      - key: MAX_UPLOAD_BYTES
        value: "8388608"
      - key: MAX_IMAGE_PIXELS
        value: "12000000"

      # Pricing used to estimate spend. Matches claude-haiku-4-5.
      - key: CLAUDE_INPUT_PER_MTOK
        value: "1.00"
      - key: CLAUDE_OUTPUT_PER_MTOK
        value: "5.00"
